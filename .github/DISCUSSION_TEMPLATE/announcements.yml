name: Announcement
description: Maintainer announcement template for release notes and project updates.
title: "[Announcement] "
labels:
  - announcement
body:
  - type: markdown
    attributes:
      value: |
        Use this for maintainer announcements. Do not include secrets, private receipts, or private logs.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What changed or what should readers know?
      placeholder: RunWitness alpha is ready for...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include links, verification notes, and any safety caveats.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Publishing checks
      options:
        - label: This announcement does not claim upstream-official status unless an upstream project has accepted, listed, or shipped the integration.
          required: true
        - label: This announcement contains no secrets, private receipts, or private logs.
          required: true
