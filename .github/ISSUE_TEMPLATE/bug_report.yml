name: Bug report
description: Report a reproducible RunWitness defect, crash, or broken workflow.
title: "[Bug]: "
labels:
  - bug
  - alpha
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing RunWitness while it is still alpha software.

        Security warning: do not disclose vulnerabilities, exploit details, secrets, tokens, private receipts, customer data, or sensitive infrastructure information in a public issue. If you believe you found a security vulnerability, stop here and report it privately to the maintainers instead.

  - type: input
    id: runwitness-version
    attributes:
      label: RunWitness version
      description: Use `runwitness --version`, the package version, commit SHA, or release tag.
      placeholder: "0.1.0-alpha, v0.1.0, or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Where did the problem occur?
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Windows 11 24H2, macOS 15.5, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: "v22.17.0"
    validations:
      required: true

  - type: input
    id: npm-version
    attributes:
      label: npm version
      description: Run `npm --version`.
      placeholder: "10.9.2"
    validations:
      required: true

  - type: textarea
    id: affected-area
    attributes:
      label: Affected area
      description: Which RunWitness command, package, workflow, adapter, policy, receipt, sandbox, or UI area is involved?
      placeholder: "Example: CLI receipt capture, sandbox preflight, MCP adapter, desktop cockpit"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the issue.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should RunWitness have done?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error names or exit codes when useful.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and receipts
      description: Paste relevant logs, receipt excerpts, stack traces, or command output. Remove secrets, tokens, private keys, internal hostnames, customer data, and exploit details before posting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add safe screenshots, sanitized config snippets, related issues, or notes about how often this reproduces.
    validations:
      required: false
